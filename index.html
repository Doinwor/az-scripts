<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZ Verified Scripts</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Контейнер для красивых уведомлений -->
    <div id="toast-container"></div>

    <header class="header">
        <div class="logo">
            <span>🛡️</span> AZ Scripts
        </div>
        <button class="settings-btn">⚙️</button>
    </header>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Поиск проверенных скриптов..." class="search-input">
    </div>

    <div class="tags-scroll">
        <span class="tag active">Все</span>
        <span class="tag">Хелперы</span>
        <span class="tag">Оптимизация</span>
    </div>

    <main class="script-list" id="script-list">
        <!-- Сюда будут загружаться карточки -->
    </main>

    <!-- Нижняя панель навигации -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <span class="nav-icon">📁</span>
            <span class="nav-text">Каталог</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">❤️</span>
            <span class="nav-text">Избранное</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">⚙️</span>
            <span class="nav-text">Настройки</span>
        </a>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
